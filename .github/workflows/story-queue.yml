name: Story navbati
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # har 10 daqiqada tekshiradi (GitHub soatlikni ko'p tashlab ketdi)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: story-queue, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/story_queue.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Natijani saqlash va saytni yangilash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "story-bot"; git config user.email "story-bot@users.noreply.github.com"
          git add content/story-queue.json content/story-map.json
          git commit -m "story navbati: yangi story chiqdi" || exit 0
          git pull --rebase -q && git push -q
          gh workflow run deploy.yml --ref main
