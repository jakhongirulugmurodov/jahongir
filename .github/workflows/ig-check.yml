name: Instagram ulanishini tekshirish
on:
  workflow_dispatch:
    inputs:
      akkaunt: { description: "asosiy (jahongir.olmos) yoki osish (osish.nuqtasi)", default: "asosiy" }
  push:
    branches: [main]
    paths: [scripts/ig_check.py, .github/workflows/ig-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ig_check.py
        env:
          IG_TOKEN: ${{ (inputs.akkaunt == 'osish') && secrets.IG_TOKEN_OSISH || secrets.IG_TOKEN }}
