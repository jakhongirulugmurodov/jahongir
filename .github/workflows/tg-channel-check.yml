name: Telegram kanalni tekshirish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/tg_channel_check.py]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tg_channel_check.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
